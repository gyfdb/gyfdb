name: stats

on:
  schedule:
    - cron: "17 9 * * *"   # daily, ~4am eastern
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/scripts/stats.py
      - .github/workflows/stats.yml

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: true

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate
        run: python .github/scripts/stats.py
        env:
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}

      # bot identity so the daily commit doesn't pad my own commit count
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats
          git diff --cached --quiet && exit 0
          git commit -m "chore: update stats"
          git push
